
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#080d18">
<title>HIGHWAY RACING 3D</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080d18;color:white;
 font-family:Arial,sans-serif;overflow:hidden;
}
#game{position:relative;width:100vw;height:100dvh}
canvas{display:block;width:100%;height:100%}
.hud{
 position:absolute;top:18px;left:18px;right:18px;
 display:flex;justify-content:space-between;
 align-items:flex-start;pointer-events:none;
}
.logo{font-size:22px;font-weight:900;color:#fbbf24}
.logo span{display:block;font-size:11px;color:#cbd5e1;letter-spacing:3px;margin-top:5px}
.speed{
 background:#101827dd;padding:12px 20px;
 border:1px solid #475569;border-radius:12px;text-align:center;
}
.speed strong{display:block;font-size:30px;color:#fbbf24}
.speed small{font-size:10px;color:#cbd5e1}
.controls{
 position:absolute;bottom:25px;left:0;right:0;
 display:flex;justify-content:space-between;
 padding:0 25px;pointer-events:none;
}
.controls button{
 pointer-events:auto;width:75px;height:75px;
 border-radius:50%;border:2px solid #ffffff70;
 background:#101827cc;color:white;
 font-size:28px;touch-action:none;
}
.message{
 position:absolute;top:50%;left:50%;
 transform:translate(-50%,-50%);
 background:#101827dd;padding:20px 28px;
 border-radius:15px;text-align:center;
 pointer-events:none;
}
.message h2{color:#fbbf24;margin:0 0 8px}
.message p{color:#cbd5e1;font-size:13px}
@media(max-width:500px){
 .logo{font-size:17px}
 .speed strong{font-size:25px}
 .controls button{width:68px;height:68px}
}
</style>
</head>

<body>
<div id="game">

 <div class="hud">
  <div class="logo">
   🏎️ HIGHWAY RACING
   <span>3D RACING EXPERIENCE</span>
  </div>

  <div class="speed">
   <strong id="speed">0</strong>
   <small>KM/H</small>
  </div>
 </div>

 <div class="message" id="message">
  <h2>3D WORLD READY</h2>
  <p>Use arrow keys or touch controls to steer.</p>
 </div>

 <div class="controls">
  <button id="left">◀</button>
  <button id="right">▶</button>
 </div>

</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

// SCENE
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb,35,150);

// CAMERA
const camera = new THREE.PerspectiveCamera(
 65,window.innerWidth/window.innerHeight,0.1,300
);
camera.position.set(0,6,12);

// RENDERER
const renderer = new THREE.WebGLRenderer({
 antialias:true
});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.2;
document.getElementById("game").prepend(renderer.domElement);

// LIGHTING
scene.add(new THREE.HemisphereLight(0xffffff,0x455044,2));

const sunlight=new THREE.DirectionalLight(0xffffff,2.5);
sunlight.position.set(-15,25,10);
sunlight.castShadow=true;
scene.add(sunlight);

// MATERIALS
const roadMat=new THREE.MeshStandardMaterial({
 color:0x30343a,roughness:0.95
});
const grassMat=new THREE.MeshStandardMaterial({
 color:0x24713a,roughness:1
});
const lineMat=new THREE.MeshStandardMaterial({
 color:0xffffff
});

// GROUND
const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(300,300),
 grassMat
);
ground.rotation.x=-Math.PI/2;
ground.position.y=-0.15;
scene.add(ground);

// HIGHWAY
const road=new THREE.Mesh(
 new THREE.PlaneGeometry(14,220),
 roadMat
);
road.rotation.x=-Math.PI/2;
road.position.set(0,0,-85);
road.receiveShadow=true;
scene.add(road);

// ROAD EDGES
function box(w,h,d,mat,x,y,z){
 const mesh=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),mat
 );
 mesh.position.set(x,y,z);
 mesh.castShadow=true;
 mesh.receiveShadow=true;
 scene.add(mesh);
 return mesh;
}

box(0.18,0.06,220, new THREE.MeshStandardMaterial({color:0xffffff}),-6.8,0.05,-85);
box(0.18,0.06,220, new THREE.MeshStandardMaterial({color:0xffffff}),6.8,0.05,-85);

// LANE MARKINGS
const markers=[];

for(let lane of [-2.3,2.3]){
 for(let i=0;i<24;i++){
  const marker=box(0.12,0.035,3.5,lineMat,lane,0.04,-i*9);
  markers.push(marker);
 }
}

// TREES
function createTree(x,z){
 const group=new THREE.Group();

 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(0.18,0.25,2,8),
  new THREE.MeshStandardMaterial({color:0x70452a})
 );
 trunk.position.y=1;
 group.add(trunk);

 const leaves=new THREE.Mesh(
  new THREE.ConeGeometry(1.3,3.5,8),
  new THREE.MeshStandardMaterial({color:0x14532d})
 );
 leaves.position.y=3.2;
 group.add(leaves);

 group.position.set(x,0,z);
 scene.add(group);
}

for(let z=-120;z<20;z+=12){
 createTree(-10,z);
 createTree(10,z);
}

// PLAYER CAR
const player=new THREE.Group();
scene.add(player);

const red=new THREE.MeshStandardMaterial({
 color:0xe11d48,metalness:0.65,roughness:0.3
});
const glass=new THREE.MeshStandardMaterial({
 color:0x162f43,metalness:0.5,roughness:0.2
});
const black=new THREE.MeshStandardMaterial({
 color:0x101010,roughness:0.8
});

// Car body
function carPart(w,h,d,mat,x,y,z){
 const part=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),mat
 );
 part.position.set(x,y,z);
 part.castShadow=true;
 player.add(part);
 return part;
}

carPart(2.1,0.55,4,red,0,0.75,0);
carPart(1.55,0.65,1.8,glass,0,1.28,-0.25);
carPart(2.05,0.15,0.9,red,0,0.85,-1.45);
carPart(1.8,0.12,0.6,red,0,1.05,1.65);

// Wheels
for(let x of [-1.05,1.05]){
 for(let z of [-1.25,1.25]){
  const wheel=new THREE.Mesh(
   new THREE.CylinderGeometry(0.42,0.42,0.3,20),
   black
  );
  wheel.rotation.z=Math.PI/2;
  wheel.position.set(x,0.43,z);
  wheel.castShadow=true;
  player.add(wheel);
 }
}

// Headlights
const lightMat=new THREE.MeshStandardMaterial({
 color:0xffffff,emissive:0xffffff,emissiveIntensity:1.5
});

carPart(0.35,0.15,0.1,lightMat,-0.7,0.8,-2.02);
carPart(0.35,0.15,0.1,lightMat,0.7,0.8,-2.02);

player.position.set(0,0,4);

// CONTROLS
let targetX=0;
let speed=0;
const maxX=4.8;

const keys={left:false,right:false};

document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")keys.left=true;
 if(e.key==="ArrowRight"||e.key==="d")keys.right=true;
});

document.addEventListener("keyup",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")keys.left=false;
 if(e.key==="ArrowRight"||e.key==="d")keys.right=false;
});

function bindButton(id,dir){
 const btn=document.getElementById(id);
 btn.addEventListener("pointerdown",e=>{
  e.preventDefault();
  keys[dir]=true;
 });
 ["pointerup","pointerleave","pointercancel"].forEach(event=>{
  btn.addEventListener(event,()=>keys[dir]=false);
 });
}
bindButton("left","left");
bindButton("right","right");

// ANIMATION
const clock=new THREE.Clock();

function animate(){
 requestAnimationFrame(animate);

 const dt=Math.min(clock.getDelta(),0.05);

 speed=Math.min(speed+35*dt,160);

 if(keys.left)targetX-=8*dt;
 if(keys.right)targetX+=8*dt;

 targetX=THREE.MathUtils.clamp(targetX,-maxX,maxX);

 player.position.x=THREE.MathUtils.lerp(
  player.position.x,targetX,dt*5
 );

 player.rotation.z=THREE.MathUtils.lerp(
  player.rotation.z,
  (targetX-player.position.x)*-0.08,
  dt*5
 );

 // Moving highway markings
 markers.forEach(marker=>{
  marker.position.z+=speed*dt*0.12;
  if(marker.position.z>12)marker.position.z=-205;
 });

 // Chase camera
 camera.position.x=THREE.MathUtils.lerp(
  camera.position.x,player.position.x*0.45,dt*2
 );
 camera.lookAt(player.position.x*0.2,0,-9);

 document.getElementById("speed").textContent=
  Math.round(speed);

 renderer.render(scene,camera);
}

animate();

window.addEventListener("resize",()=>{
 camera.aspect=window.innerWidth/window.innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>
</body>
</html>
