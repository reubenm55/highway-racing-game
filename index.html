
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101827">
<title>Highway Racing</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #101827;
  color: white;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 20px;
}

.game {
  width: 100%;
  max-width: 480px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

h1 {
  color: #fbbf24;
  margin: 5px 0;
  font-size: 28px;
}

.subtitle {
  color: #94a3b8;
  font-size: 13px;
}

.stats {
  display: flex;
  gap: 10px;
  margin: 20px 0;
}

.stat {
  background: #26354d;
  flex: 1;
  text-align: center;
  padding: 12px;
  border-radius: 10px;
}

.stat small {
  color: #94a3b8;
  display: block;
  margin-bottom: 5px;
}

.stat strong {
  font-size: 22px;
}

#road {
  width: 100%;
  height: 560px;
  max-height: 65vh;
  min-height: 380px;
  background: #3d454c;
  position: relative;
  overflow: hidden;
  border: 6px solid #64748b;
  border-radius: 12px;
}

.grass {
  position: absolute;
  width: 14%;
  height: 100%;
  background: repeating-linear-gradient(
    0deg,
    #166534 0px,
    #166534 30px,
    #15803d 30px,
    #15803d 60px
  );
  top: 0;
}

.grass.left {left: 0;}
.grass.right {right: 0;}

.lane-line {
  position: absolute;
  height: 100%;
  width: 5px;
  top: 0;
  background: repeating-linear-gradient(
    to bottom,
    white 0px,
    white 45px,
    transparent 45px,
    transparent 90px
  );
}

.lane-one {
  left: 38.5%;
}

.lane-two {
  left: 61.5%;
}

.car {
  position: absolute;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  width: 58px;
  height: 100px;
  background: linear-gradient(90deg,#dc2626,#ef4444,#991b1b);
  border-radius: 18px 18px 9px 9px;
  border: 2px solid #fecaca;
  box-shadow: 0 0 15px #0008;
  z-index: 5;
}

.car::before {
  content: "";
  position: absolute;
  width: 36px;
  height: 28px;
  background: #bae6fd;
  border-radius: 8px 8px 3px 3px;
  top: 18px;
  left: 9px;
}

.car::after {
  content: "";
  position: absolute;
  width: 36px;
  height: 16px;
  background: #7dd3fc;
  border-radius: 3px;
  bottom: 15px;
  left: 9px;
}

.wheel {
  position: absolute;
  width: 9px;
  height: 23px;
  background: #111827;
  border-radius: 4px;
  top: 30px;
}

.wheel.left {left:-6px;}
.wheel.right {right:-6px;}

.start-screen {
  text-align: center;
  margin-top: 18px;
}

button {
  border: none;
  border-radius: 10px;
  padding: 14px 22px;
  font-size: 16px;
  font-weight: bold;
  background: #f59e0b;
  color: #111827;
  cursor: pointer;
}

button:hover {
  background: #fbbf24;
}

.controls {
  display: flex;
  gap: 15px;
  margin-top: 15px;
  justify-content: center;
}

.controls button {
  flex: 1;
  max-width: 130px;
  background: #26354d;
  color: white;
}

.instructions {
  color: #94a3b8;
  text-align: center;
  font-size: 13px;
  line-height: 1.6;
  margin-top: 15px;
}

@media(max-width:400px) {
  #road {height: 480px;}
  h1 {font-size: 23px;}
}
</style>
</head>

<body>
<div class="game">

  <div class="header">
    <div>
      <h1>🏎️ HIGHWAY RACING</h1>
      <div class="subtitle">Ultimate Racing Challenge</div>
    </div>
    <div>🏁</div>
  </div>

  <div class="stats">
    <div class="stat">
      <small>SPEED</small>
      <strong id="speed">0</strong>
      <small>KM/H</small>
    </div>

    <div class="stat">
      <small>DISTANCE</small>
      <strong id="distance">0</strong>
      <small>KM</small>
    </div>
  </div>

  <div id="road">
    <div class="grass left"></div>
    <div class="grass right"></div>

    <div class="lane-line lane-one"></div>
    <div class="lane-line lane-two"></div>

    <div class="car" id="player">
      <div class="wheel left"></div>
      <div class="wheel right"></div>
    </div>
  </div>

  <div class="start-screen">
    <button id="startBtn">START RACE</button>
  </div>

  <div class="controls">
    <button id="leftBtn">⬅ LEFT</button>
    <button id="rightBtn">RIGHT ➡</button>
  </div>

  <div class="instructions">
    Use arrow keys or touch controls to steer.<br>
    Avoid traffic and race to victory!
  </div>

</div>
</body>
</html>
