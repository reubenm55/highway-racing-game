
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101827">
<title>Highway Racing</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;background:#101827;color:white;
 font-family:Arial,sans-serif;
 display:flex;justify-content:center;
 min-height:100vh;padding:15px;
}

.game{width:100%;max-width:480px}
.header{display:flex;justify-content:space-between;align-items:center}
h1{color:#fbbf24;margin:5px 0;font-size:27px}
.subtitle{color:#94a3b8;font-size:13px}

.stats{display:flex;gap:10px;margin:15px 0}
.stat{background:#26354d;flex:1;text-align:center;padding:10px;border-radius:10px}
.stat small{color:#94a3b8;display:block;margin-bottom:5px}
.stat strong{font-size:22px}

#road{
 width:100%;height:560px;max-height:65vh;min-height:380px;
 background:#3d454c;position:relative;overflow:hidden;
 border:6px solid #64748b;border-radius:12px;
}

.grass{position:absolute;width:14%;height:100%;top:0;
 background:repeating-linear-gradient(0deg,#166534 0px,#166534 30px,#15803d 30px,#15803d 60px)}
.grass.left{left:0}
.grass.right{right:0}

.lane-line{
 position:absolute;height:100%;width:5px;top:0;
 background:repeating-linear-gradient(to bottom,white 0px,white 45px,transparent 45px,transparent 90px);
}
.lane-one{left:38.5%}
.lane-two{left:61.5%}

.road-marker{
 position:absolute;top:-100px;width:5px;height:45px;
 background:white;z-index:2;
}

.car{
 position:absolute;width:58px;height:100px;
 border-radius:18px 18px 9px 9px;
 border:2px solid #fecaca;
 box-shadow:0 0 15px #0008;
 z-index:5;
}

.player{
 bottom:30px;left:50%;
 transform:translateX(-50%);
 background:linear-gradient(90deg,#dc2626,#ef4444,#991b1b);
}

.car::before{
 content:"";position:absolute;width:36px;height:28px;
 background:#bae6fd;border-radius:8px 8px 3px 3px;
 top:18px;left:9px;
}

.car::after{
 content:"";position:absolute;width:36px;height:16px;
 background:#7dd3fc;border-radius:3px;
 bottom:15px;left:9px;
}

.traffic{
 top:-110px;
 background:linear-gradient(90deg,#1d4ed8,#3b82f6,#1e40af);
}

.start-screen{text-align:center;margin-top:15px}

button{
 border:none;border-radius:10px;padding:13px 20px;
 font-size:15px;font-weight:bold;background:#f59e0b;
 color:#111827;cursor:pointer;touch-action:manipulation;
}

button:hover{background:#fbbf24}

.controls{display:flex;gap:15px;margin-top:13px;justify-content:center}
.controls button{flex:1;max-width:130px;background:#26354d;color:white}

.instructions{text-align:center;color:#94a3b8;font-size:13px;line-height:1.6;margin-top:13px}

.overlay{
 position:absolute;inset:0;background:#101827dd;
 display:none;justify-content:center;align-items:center;
 flex-direction:column;text-align:center;z-index:10;
}

.overlay h2{color:#fbbf24;font-size:32px}

@media(max-width:400px){
 #road{height:480px}
 h1{font-size:22px}
}
</style>
</head>

<body>
<div class="game">

 <div class="header">
  <div>
   <h1>🏎️ HIGHWAY RACING</h1>
   <div class="subtitle">Ultimate Racing Challenge</div>
  </div>
  <div>🏁</div>
 </div>

 <div class="stats">
  <div class="stat">
   <small>SPEED</small>
   <strong id="speed">0</strong>
   <small>KM/H</small>
  </div>
  <div class="stat">
   <small>DISTANCE</small>
   <strong id="distance">0.0</strong>
   <small>KM</small>
  </div>
 </div>

 <div id="road">
  <div class="grass left"></div>
  <div class="grass right"></div>
  <div class="lane-line lane-one"></div>
  <div class="lane-line lane-two"></div>

  <div class="car player" id="player"></div>

  <div class="overlay" id="gameOver">
   <h2>RACE OVER!</h2>
   <p>Your distance: <strong id="finalDistance">0</strong> KM</p>
   <button onclick="startGame()">RACE AGAIN</button>
  </div>
 </div>

 <div class="start-screen">
  <button id="startBtn" onclick="startGame()">START RACE</button>
 </div>

 <div class="controls">
  <button id="leftBtn">⬅ LEFT</button>
  <button id="rightBtn">RIGHT ➡</button>
 </div>

 <div class="instructions">
  Use arrow keys or touch controls to steer.<br>
  Avoid traffic and race to victory!
 </div>

</div>

<script>
const road=document.getElementById("road");
const player=document.getElementById("player");
const speedText=document.getElementById("speed");
const distanceText=document.getElementById("distance");

let running=false;
let speed=0;
let distance=0;
let playerX=50;
let traffic=[];
let markers=[];
let lastTime=0;
let spawnTimer=0;
let animationId=null;
let keys={left:false,right:false};

function roadBounds(){
 return {min:17,max:83};
}

function createTraffic(){
 const lanes=[27,50,73];
 const lane=lanes[Math.floor(Math.random()*lanes.length)];

 const car=document.createElement("div");
 car.className="car traffic";
 car.style.left=lane+"%";
 road.appendChild(car);

 traffic.push({element:car,x:lane,y:-110});
}

function createMarkers(){
 markers=[];
 document.querySelectorAll(".road-marker").forEach(m=>m.remove());

 [38.5,61.5].forEach(x=>{
  for(let i=0;i<7;i++){
   const marker=document.createElement("div");
   marker.className="road-marker";
   marker.style.left=x+"%";
   marker.style.top=(i*90-100)+"px";
   road.appendChild(marker);
   markers.push(marker);
  }
 });
}

function startGame(){
 if(animationId) cancelAnimationFrame(animationId);

 traffic.forEach(t=>t.element.remove());
 traffic=[];
 speed=0;
 distance=0;
 playerX=50;
 running=true;
 lastTime=0;
 spawnTimer=0;
 keys={left:false,right:false};

 player.style.left="50%";
 document.getElementById("gameOver").style.display="none";
 document.getElementById("startBtn").textContent="RESTART RACE";

 createMarkers();
 animationId=requestAnimationFrame(gameLoop);
}

function endGame(){
 running=false;
 speed=0;
 document.getElementById("finalDistance").textContent=distance.toFixed(1);
 document.getElementById("gameOver").style.display="flex";
 document.getElementById("startBtn").textContent="PLAY AGAIN";
}

function gameLoop(timestamp){
 if(!running)return;

 if(!lastTime)lastTime=timestamp;
 const dt=Math.min((timestamp-lastTime)/1000,0.05);
 lastTime=timestamp;

 speed=Math.min(speed+45*dt,220);
 distance+=speed*dt/3600*10;

 speedText.textContent=Math.round(speed);
 distanceText.textContent=distance.toFixed(1);

 const bounds=roadBounds();
 if(keys.left)playerX-=65*dt;
 if(keys.right)playerX+=65*dt;

 playerX=Math.max(bounds.min,Math.min(bounds.max,playerX));
 player.style.left=playerX+"%";

 const roadHeight=road.clientHeight;

 markers.forEach(marker=>{
  let y=parseFloat(marker.style.top)||0;
  y+=speed*dt*1.5;
  if(y>roadHeight)y=-45;
  marker.style.top=y+"px";
 });

 spawnTimer+=dt;
 if(spawnTimer>Math.max(0.55,1.6-speed/250)){
  createTraffic();
  spawnTimer=0;
 }

 for(let i=traffic.length-1;i>=0;i--){
  const t=traffic[i];
  t.y+=speed*dt*1.3;
  t.element.style.top=t.y+"px";

  if(t.y>roadHeight){
   t.element.remove();
   traffic.splice(i,1);
   continue;
  }

  const playerRect=player.getBoundingClientRect();
  const trafficRect=t.element.getBoundingClientRect();

  if(
   playerRect.left<trafficRect.right-10 &&
   playerRect.right>trafficRect.left+10 &&
   playerRect.top<trafficRect.bottom-10 &&
   playerRect.bottom>trafficRect.top+10
  ){
   endGame();
   return;
  }
 }

 animationId=requestAnimationFrame(gameLoop);
}

document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"||e.key==="ArrowRight")e.preventDefault();
 if(e.key==="ArrowLeft"||e.key==="a")keys.left=true;
 if(e.key==="ArrowRight"||e.key==="d")keys.right=true;
});

document.addEventListener("keyup",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")keys.left=false;
 if(e.key==="ArrowRight"||e.key==="d")keys.right=false;
});

function bindButton(id,direction){
 const btn=document.getElementById(id);
 btn.addEventListener("pointerdown",e=>{
  e.preventDefault();
  keys[direction]=true;
 });
 ["pointerup","pointerleave","pointercancel"].forEach(event=>{
  btn.addEventListener(event,()=>keys[direction]=false);
 });
}

bindButton("leftBtn","left");
bindButton("rightBtn","right");

document.addEventListener("visibilitychange",()=>{
 if(document.hidden){
  keys.left=false;
  keys.right=false;
 }
});
</script>

</body>
</html>
